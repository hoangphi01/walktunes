# Shared defaults for classic (non-Android) Sony Walkmans (Tier 1).
# Evidence: R-006 (Sony updater) and R-003 part 1 (real NW-ZX300 probe, 2026-11-11).
id = "sony.classic.base"
name = "Sony Walkman (classic)"
family = "sony.classic"
tier = 1
abstract = true

[detect]
usb_vendor_id = 0x054c
scsi_vendor = "SONY"
product_contains = ["WALKMAN"]          # INQUIRY product and USB iProduct are both "WALKMAN" (R-003)
volume_labels = ["WALKMAN"]             # internal storage label (R-003); SD cards keep their own label
required_dirs = ["MUSIC"]
group_by = "usb_serial"                 # internal = LUN 0, SD = LUN 1 on one USB device (R-003)
marker_files = ["default-capability.xml", "DevIcon.fil", "DevLogo.fil"]   # on every volume (R-003)
capability_vendor = "Sony"
capability_class = "WALKMAN"
# Never create, modify or delete these (SECURITY S-10):
protected_root_files = ["NW_WM_FW.UPG", "default-capability.xml", "DevIcon.fil", "DevLogo.fil"]

[layout]
music_dir = "MUSIC"
