# Model names from the Sony updater's SWUpdate.xml (R-006).
id = "sony.classic.zx300"
name = "Sony NW-ZX300"
family = "sony.classic"
tier = 1
inherits = "sony.classic.base"

[detect]
usb_product_ids = [0x0c70]              # R-003 part 1 (mass-storage mode)
capability_models = ["NW-ZX300Series"]  # default-capability.xml (R-003 part 1)

[[models]]
name = "NW-ZX300"
aliases = ["NW-ZX300A"]
capacity_gb = 64
