# SPDX-License-Identifier: MIT OR Apache-2.0
# Recipe for `cargo xtask fixtures` (docs/TESTING.md §3).
#
# Every clip is synthetic (sine or noise, 1–3 s): no copyrighted audio is ever committed
# or generated. Names are invented, except the artist tag "Sơn Tùng", kept because the
# Day 2 exit check searches for it (`search "son tung"`).
#
# clip fields: path (under fixtures/media/), codec (flac|mp3|aac|alac|wav|aiff),
# rate, bits (lossless only), bitrate or vbr_quality (lossy), seconds, signal
# ("sine:<hz>" | "noise"), art (an [[art]] id), tags (title, artist, album,
# album_artist, track, disc, date, genre).

[[art]]
id = "jpeg500"
kind = "jpeg"            # baseline JPEG
size = 500
color = "21A89B"

[[art]]
id = "progressive1000"
kind = "jpeg-progressive"
size = 1000
color = "2E7D32"

[[art]]
id = "png300"
kind = "png"
size = 300
color = "B7410E"

# --- A tagged Vietnamese album (FLAC 16/44.1, baseline art) --------------------------

[[clip]]
path = "Sơn Tùng/Hà Nội Mùa Thu/01 Bài Mở Đầu.flac"
