rate = 44100
bits = 16
seconds = 2
signal = "sine:440"
art = "jpeg500"
tags = { title = "Bài Mở Đầu", artist = "Sơn Tùng", album = "Hà Nội Mùa Thu", album_artist = "Sơn Tùng", track = "1/2", disc = "1/1", date = "2026", genre = "V-Pop" }

