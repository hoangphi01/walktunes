# SPDX-License-Identifier: MIT OR Apache-2.0
[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hoangphi01/walktunes"
authors = ["WalkTunes contributors"]
publish = false

[workspace.dependencies]
# internal crates
wt-core = { path = "crates/wt-core" }
wt-config = { path = "crates/wt-config" }
wt-watch = { path = "crates/wt-watch" }
wt-bus = { path = "crates/wt-bus" }
wt-queue = { path = "crates/wt-queue" }
wt-i18n = { path = "crates/wt-i18n" }
wt-dsp = { path = "crates/wt-dsp" }
wt-ledger = { path = "crates/wt-ledger" }
wt-vault = { path = "crates/wt-vault" }
wt-gate = { path = "crates/wt-gate" }
wt-cache = { path = "crates/wt-cache" }
wt-crawler = { path = "crates/wt-crawler" }
wt-enrich = { path = "crates/wt-enrich" }
wt-forge = { path = "crates/wt-forge" }
wt-dock = { path = "crates/wt-dock" }
wt-inspect = { path = "crates/wt-inspect" }
wt-sync = { path = "crates/wt-sync" }
wt-sdk = { path = "crates/wt-sdk" }
wt-kit = { path = "crates/wt-kit" }

# third-party
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v7", "serde"] }
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
flume = "0.12.0"
clap = { version = "4.6.7", features = ["derive"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["disk"] }
plist = "1.10.3"
roxmltree = "0.21.2"

# dev
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
