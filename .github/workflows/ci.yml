# SPDX-License-Identifier: GPL-3.0-or-later
# CI gates: docs/TESTING.md §6 and docs/DEVELOPMENT.md §6.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (fmt, clippy, layers, docs, deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask layers
      - run: cargo xtask docs-check
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: probe virtual devices
        shell: bash
        run: |
          Z=fixtures/devices/sony.classic.zx300; A=fixtures/devices/sony.classic.a40
          WT_DATA_DIR="$RUNNER_TEMP/wt" WT_FAKE_VOLUMES="$Z/internal,$Z/sd,$A/internal" \
            cargo run --quiet -p wt-cli -- device probe
